name: svm

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Anchor Test
    runs-on: ubuntu-latest
    env:
      BRIDGE_ADDRESS: worm2ZoG2kUd4vFXhvjh93UUH596ayRfgQ2MgjNMTth
      TOKEN_BRIDGE_ADDRESS: wormDTUJ6AWPNvk59vGQbDvGJmqbDTdgWgAqcLBCgUb
    defaults:
      run:
        working-directory: svm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get solana version
        id: solana
        run: |
          SOLANA_VERSION="$(awk '/solana_version =/ { print substr($3, 2, length($3)-2) }' Anchor.toml)"
          echo "version=${SOLANA_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Get anchor version
        id: anchor
        run: |
          ANCHOR_VERSION="$(awk '/anchor_version =/ { print substr($3, 2, length($3)-2) }' Anchor.toml)"
          echo "version=${ANCHOR_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: evan-gray/anchor-test@c267e0e6225eb1177512aac058d46feeac215189 # main
        with:
          node-version: "26.13.0"
          anchor-version: "${{steps.anchor.outputs.version}}"
          solana-cli-version: "${{steps.solana.outputs.version}}"
          working-directory: "svm"

      - run: cargo fmt --check --all
      - run: cargo clippy
      - run: cargo test
