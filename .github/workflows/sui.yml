name: sui

on: pull_request

jobs:
  sui-test:
    name: Run Build and Tests
    runs-on: ubuntu-latest
    container: mysten/sui-tools:mainnet-v1.63.4@sha256:1c2b1c7a46e7584d1edd8875651bcbbc20a198fc2e80cf56304c608d65b17e98
    steps:
      - uses: actions/checkout@v4
      - name: Test Sui Token Bridge Relayer v4
        working-directory: sui/token_bridge_relayer
        run: |
          sui move build
          sui move test
      - name: Test Sui Token Bridge Relayer v4
        working-directory: sui/token_bridge_ptb_resolver
        run: |
          sui move build
          sui move test
